#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "diaspora"
name = "Diaspora"
description.en = "Distributed social networking service"
description.fr = "Service de réseau social distribué"

version = "0.10.1~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0"
website = "https://diasporafoundation.org/"
admindoc = "https://wiki.diasporafoundation.org/FAQ_for_pod_maintainers"
userdoc = "https://wiki.diasporafoundation.org/FAQ_for_users"
code = "https://github.com/diaspora/diaspora"

[integration]
yunohost = ">=12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "500M"
ram.build = "2000M"
ram.runtime = "2000M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

    [install.password]
    help.en = "Admin password. Must contain at least 10 characters, one lowercase letter, one uppercase letter, one number, and one symbol (e.g. '~!@#$%^&*()')."
    help.fr = "Mot de passe pour l’administrateur. Doit contenir au moins 10 caractères, une majuscule, une minuscule, un chiffre, et une ponctuation (ex. '~!@#$%^&*()')."
    type = "password"
    optional = false

[resources]
    [resources.sources.main]
    url = "https://github.com/diaspora/diaspora/archive/refs/tags/v0.10.1.tar.gz"
    sha256 = "aba3f313af277eb22686e195211de821cbbabfad0bfd65e0863d4a1e72a7a66b"

    autoupdate.strategy = "latest_github_release"

    [resources.system_user]
    allow_email = true

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = [
        "build-essential",
        "curl",
        "gsfonts",
        "imagemagick",
        "libmagickwand-dev",
        "redis-server",
        "libssl-dev",
        "libcurl4-openssl-dev",
        "libxml2-dev",
        "libxslt1-dev",
        "libidn11-dev",
        "libpq-dev",

        "postgresql",

        # Is it still required?
        "cmake",
        "ghostscript",
        "libffi-dev",
        "libgdbm-dev",
        "libncurses5-dev",
        "libyaml-dev",
        "pkg-config",
        "sqlite3",
        "libgmp-dev",
        # For Ruby
        "libjemalloc-dev",
        "libreadline-dev",
        "zlib1g-dev",
        "libsqlite3-dev",
        "libxslt-dev",
        "autoconf",
        "automake",
        "bison",
        "libtool",
    ]

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"

    [resources.ruby]
    version = "3.3"